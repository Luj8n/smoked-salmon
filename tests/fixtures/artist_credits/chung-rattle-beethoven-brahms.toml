why = "A symphony (orchestra + conductor) and a concerto (soloist + orchestra + conductor) on one album; Deezer drops the orchestra and conductor from the concerto, MusicBrainz writes the soloist in Hangul."
edition = "EMI Classics 2001 (recorded live, Vienna), 7 tracks: Deezer 393087 (digital, UPC 724355716552); MusicBrainz bb465a9d is the CD (724355716521, same catalogue 5 57165); Discogs 8091122 is master 997896's main release"
known_wrong = ["Deezer parse: concerto tracks 5-7 credit Kyung-Wha Chung alone, losing orchestra and conductor", "Qobuz and merge: inconsistent spellings of the soloist and orchestra remain separate credits; the conductor is still main in some sources"]
